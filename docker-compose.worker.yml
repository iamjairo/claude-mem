# claude-mem worker stack with MongoDB backend.
#
# Runs the worker-service backed by MongoDB instead of a local SQLite file.
# MongoDB gives you a proper database server with persistent named volumes,
# concurrent access, and GUI tooling via mongo-express.
#
# Usage:
#   1. Copy .env.mongodb.example to .env.mongodb and fill in your API key:
#        cp .env.mongodb.example .env.mongodb
#        # edit .env.mongodb — set ANTHROPIC_API_KEY
#
#   2. Start the full stack (worker + MongoDB + mongo-express UI):
#        docker compose -f docker-compose.worker.yml --env-file .env.mongodb up -d
#
#   3. Point Claude Code hooks and Claude Desktop MCP server to port 37777:
#        CLAUDE_MEM_WORKER_HOST=127.0.0.1
#        CLAUDE_MEM_WORKER_PORT=37777
#
#   4. Verify worker health:
#        curl http://127.0.0.1:37777/healthz
#
#   5. Browse data in mongo-express (optional):
#        http://localhost:8081
#        Default credentials: admin / pass  (change ME_CONFIG_BASICAUTH_PASSWORD below)
#
# To stop:        docker compose -f docker-compose.worker.yml down
# To destroy data: docker compose -f docker-compose.worker.yml down -v
# To tail logs:   docker compose -f docker-compose.worker.yml logs -f
#
# SQLite-only mode (original behaviour):
#   Omit --env-file .env.mongodb and pass CLAUDE_MEM_DATA_DIR on the CLI:
#        ANTHROPIC_API_KEY=... CLAUDE_MEM_DATA_DIR=/path docker compose -f docker-compose.worker.yml up -d

services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: claude_mem
      # Optional auth — uncomment and set credentials if you expose Mongo externally.
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-claude}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    ports:
      # Only expose to localhost. Remove or restrict further in production.
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── mongo-express (browser UI) ─────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/claude_mem
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_ADMIN_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_ADMIN_PASSWORD:-pass}
      ME_CONFIG_SITE_BASEURL: /
    ports:
      - "127.0.0.1:8081:8081"

  # ── claude-mem worker ──────────────────────────────────────────────────────
  claude-mem-worker:
    build:
      context: .
      dockerfile: docker/claude-mem/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      CLAUDE_MEM_CONTAINER_MODE: shell
      CLAUDE_MEM_DOCKER: "1"
      CLAUDE_MEM_RUNTIME: worker
      CLAUDE_MEM_QUEUE_ENGINE: sqlite
      CLAUDE_MEM_WORKER_HOST: "0.0.0.0"
      CLAUDE_MEM_WORKER_PORT: "37777"
      # Switch to MongoDB backend
      CLAUDE_MEM_DB_BACKEND: mongodb
      CLAUDE_MEM_MONGODB_URI: mongodb://mongodb:27017
      # DATA_DIR is still used for logs/config even in MongoDB mode
      CLAUDE_MEM_DATA_DIR: /data/claude-mem
      CLAUDE_MEM_CHROMA_ENABLED: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
    command: ["bun", "/opt/claude-mem/scripts/worker-service.cjs", "--daemon"]
    ports:
      - "127.0.0.1:37777:37777"
    volumes:
      # Logs and config (not the database — that lives in MongoDB)
      - worker_data:/data/claude-mem
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:37777/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

volumes:
  mongo_data:
    driver: local
  worker_data:
    driver: local
