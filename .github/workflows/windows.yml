name: Windows

on:
  pull_request:
    paths:
      - 'src/**'
      - 'plugin/scripts/**'
      - 'package.json'
      - 'bunfig.toml'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'

      - run: npm ci --no-audit --no-fund

      - run: npm run build
